name: Job Outputs Demo

on: push

jobs:
  set-date:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.get-date.outputs.date }}
    steps:
      - id: get-date
        run: echo "date=$(date)" >>$GITHUB_OUTPUT

  read-date:
    runs-on: ubuntu-latest
    needs: set-date
    steps: 
      - run: |
          echo "Date from previous job: ${{ needs.set-date.outputs.date }}"
