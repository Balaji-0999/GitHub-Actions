# This will deploy the safe / secure / test app to prod server
name: Deploy To Server

on:
    workflow_call:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: ssh to prod server & creat app folder
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.EC2_SSH_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                key: ${{ secrets.SSH_PRIVATE_KEY }}
                debug: true
                script: |
                  echo "Staring Deployment"
                  sudo apt-get update &&sudo apt-get install docker.io docker-compose-v2 -y
                  sudo usermod -aG docker $USER && newgrp docker 
                  mkdir -p DevOps
            
            - name: copy docker-compose-file
              uses: appleboy/scp-action@v1
              with:
                host: ${{ secrets.EC2_SSH_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                key: ${{ secrets.SSH_PRIVATE_KEY }}
                source: docker-compose.yml
                target: ~DevOps/

            - name: ssh to prod server & run the app 
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.EC2_SSH_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                key: ${{ secrets.SSH_PRIVATE_KEY }}
                debug: true
                script: |
                  
                 script: |
                     export DOCKERHUB_USERNAME=${{ vars.DOCKERHUB_USERNAME }}
                     echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ vars.DOCKERHUB_USERNAME }} --password-stdin
                     docker pull ${{ vars.DOCKERHUB_USERNAME }}/github-actions-app:latest
                     cd ~/DevOps && docker compose down && docker compose up -d --build
           