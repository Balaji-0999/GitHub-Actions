name: Hello

on:
    push:
        branches: [main]

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      - name: say hello user
        run: echo "Hello Dosto"

      -  name: say hello to username
         run: echo "hello $USER"

  show-versions:
      runs-on: ubuntu-latest

      steps:
        - name: show versions
          run: docker --version && python --version 
