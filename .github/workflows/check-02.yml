name: Caching Demo

on: push

jobs:
  install-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          kay: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      

        
