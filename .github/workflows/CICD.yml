# This is of the workflow that will be display in the Action Tab 
name: CICD

# Mannualy click deliver workflow whenever user needs
on:
  workflow_dispatch:
   inputs:
    environment:
     description: this is the environment where this workflow runs
     default: dev
     required: true
     type: choice
     options:
       - dev
       - prod

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        run: echo "Code Clone from GitHub"
  build:
     needs: code
     runs-on: ubuntu-latest
     steps:
      - name: Build Docker container
        run: echo "Docker container build"
  test:
     needs: [build]
     runs-on: ubuntu-latest
     steps:
      - name: Test the container
        run: echo "Testing the container"
  
  deploy:
    if: inputs.environment == 'dev'
    needs: [build,test]
    runs-on: ubuntu-latest
    steps:
    - name: Deploying the app
      run: echo "Docker compose deployed the app"
      
      
