# Scane the Dockerfile for issues & CVEs
name: Docker Lint

on:
    workflow_call:

jobs:
    validate-dockerfile:
            runs-on: ubuntu-latest

            steps:
                - name: Checkout Code
                  uses: action/checkout@v4

                - name: validate Dockerfile
                  uses: hadolint/hadolint-action@v3.1.0
                  with:
                    dockerfile: Dockerfile