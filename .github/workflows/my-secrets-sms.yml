name: Secrets as Env Vars

on: push

jobs:
  use-secret-env:
    runs-on: ubuntu-latest
    steps:
      - name: Use secret via env var
        env:
          SECRET_MSG: ${{ secrets.MY_SECRET_MESSAGE }}
        run: |
          echo "Using the secret without hardcoding it"
          # Example: pretend to authentication with it
          if [ -n "SECRET_MSG" ]; then
            echo "Authentication value received (nasked automatically)"
          fi
