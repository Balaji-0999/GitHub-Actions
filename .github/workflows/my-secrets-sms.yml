name: Artifact Between jobs

on: push

jobs:
  job-one:
    runs-on: ubuntu-latest
    steps:
      - name: Generate file
        run: echo "Data from job one" > shared-data.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-data
          path: shared-data.txt

  job-two:
   runs-on: ubuntu-latest
   needs: job-one
   steps:
     - name: Downloads artifact
       uses: actions/download-artifact@v4
       with:
         name: shared-data

     - name: print contents
       run: cat shared-data.txt
  
