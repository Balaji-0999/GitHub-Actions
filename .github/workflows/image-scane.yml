# uses Trivy image scanner for CVEs Docker image
name: image scanner

on:
    workflow_call:

jobs:
    image-scanner:
        runs-on: ubuntu-latest

        steps:
             - name: Login to Docker Hub
               uses: docker/login-action@v4
               with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

             - name: Trivy Scanner
               uses: aquasecurity/trivy-action@v0.36.0
               with:
                image-ref: ${{ vars.DOCKERHUB_USERNAME }}/github-actions-app:${{ github.sha }}
                severity: 'CRITICAL,HIGH'
                exit-code: '1'


    

